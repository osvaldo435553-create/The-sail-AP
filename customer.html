<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login- Secure Login</title>
    <style>
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; height: 100%; background: #001f3f; display: flex; justify-content: center; align-items: center; }
        .card { background: white; padding: 40px; width: 360px; border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); text-align: center; }
        .logo { font-size: 42px; font-weight: 800; color: #001f3f; margin-bottom: 5px; letter-spacing: 2px; }
        .tagline { color: #666; font-size: 14px; margin-bottom: 30px; }
        
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 11px; font-weight: bold; color: #001f3f; margin-bottom: 5px; text-transform: uppercase; }
        
        input { 
            width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 8px; 
            box-sizing: border-box; font-size: 16px; background: #f9f9f9;
        }

        .btn-blue { 
            width: 100%; padding: 16px; background-color: #0074d9; color: white; 
            border: none; border-radius: 8px; font-size: 18px; font-weight: bold; 
            cursor: pointer; margin-top: 10px;
        }

        /* The Request OTP links */
        .request-container { margin-top: 10px; font-size: 13px; }
        .request-link { color: #0074d9; cursor: pointer; font-weight: 600; text-decoration: underline; margin: 0 5px; }

        #otp-section { display: none; } 

        .footer-text { font-size: 12px; color: #888; margin-top: 20px; line-height: 1.5; }
        .footer-text a { color: #0074d9; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">SAIL</div>
        <div class="tagline">Smooth journeys start here.</div>

        <!-- PAGE 1: EMAIL AND PHONE -->
        <div id="login-section">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email-field" placeholder="example@mail.com">
            </div>

            <div class="input-group">
                <label>Phone Number (Numbers Only)</label>
                <input type="tel" id="phone-field" placeholder="024XXXXXXX" 
                       oninput="this.value = this.value.replace(/[^0-9]/g, '');">
            </div>

            <div class="request-container">
                Request OTP via: 
                <span class="request-link" onclick="triggerOTP('Email')">Email</span> or 
                <span class="request-link" onclick="triggerOTP('Phone')">Phone</span>
            </div>

            <button class="btn-blue" onclick="goToVerify()">Continue</button>
        </div>

        <!-- PAGE 2: OTP (NUMBERS ONLY) -->
        <div id="otp-section">
            <h3>Verify Code</h3>
            <p style="font-size: 14px; color: #666;">Check your device for the 4-digit code.</p>
            
            <div class="input-group">
                <label>Enter Number Code</label>
                <input type="text" id="otp-input" placeholder="0000" maxlength="4"
                       oninput="this.value = this.value.replace(/[^0-9]/g, '');"
                       style="text-align: center; letter-spacing: 20px; font-size: 24px; font-weight: bold;">
            </div>

            <button class="btn-blue" onclick="finishLogin()">Verify & Login</button>
        </div>

        <p class="footer-text">
            By continuing, you agree to our <br> 
            <a href="index.html">Terms and Services</a>
        </p>
    </div>

    <script>
        function triggerOTP(method) {
            const email = document.getElementById('email-field').value;
            const phone = document.getElementById('phone-field').value;
            
            if(!email || !phone) {
                alert("Please enter both Email and Phone first.");
                return;
            }
            
            const target = (method === 'Email') ? email : phone;
            alert("Success! A 4-digit code is being sent to " + target);
        }

        function goToVerify() {
            const email = document.getElementById('email-field').value;
            const phone = document.getElementById('phone-field').value;
            if(email && phone) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('otp-section').style.display = 'block';
            } else {
                alert("Please complete both fields.");
            }
        }

        function finishLogin() {
            const code = document.getElementById('otp-input').value;
            if(code.length === 4) {
                window.location.href = "dashboard.html";
            } else {
                alert("Enter the 4-digit code.");
            }
        }
    </script>

</body>
</html>
