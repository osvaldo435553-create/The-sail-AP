<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SAIL - Admin Registration</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #001f3f; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; width: 380px; border-radius: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); text-align: center; }
        .logo { font-size: 32px; font-weight: 900; color: #001f3f; margin-bottom: 20px; letter-spacing: 2px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 11px; font-weight: bold; color: #001f3f; margin-bottom: 5px; text-transform: uppercase; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; background: #f9f9f9; }
        .btn-reg { width: 100%; padding: 16px; background: #0074d9; color: white; border: none; border-radius: 8px; font-size: 17px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #success-msg { display: none; color: #155724; background: #d4edda; padding: 15px; border-radius: 8px; margin-top: 20px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">SAIL</div>
        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="admin_name" placeholder="Enter Full Name">
        </div>
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="admin_email" placeholder="example@sail.com">
        </div>
        <div class="input-group">
            <label>Upload ID Image</label>
            <input type="file" id="admin_id" accept="image/*" style="font-size: 12px;">
        </div>
        <button class="btn-reg" onclick="submitToOswald()">Submit for Verification</button>
        <div id="success-msg">✅ Application sent to Oswald Kingsley Bilson.</div>
    </div>

    <script>
        function submitToOswald() {
            const name = document.getElementById('admin_name').value;
            const email = document.getElementById('admin_email').value;
            const file = document.getElementById('admin_id').files[0];

            if(!name || !email || !file) {
                alert("Please complete all fields, including the ID upload.");
                return;
            }

            // Professional Data Object
            const application = {
                id: Date.now(),
                name: name,
                email: email,
                time: new Date().toLocaleString(),
                status: "pending"
            };

            // Get existing list or start new
            let applications = JSON.parse(localStorage.getItem('sail_pending_admins') || "[]");
            applications.push(application);
            
            // Save to shared memory
            localStorage.setItem('sail_pending_admins', JSON.stringify(applications));

            document.getElementById('success-msg').style.display = "block";
            document.querySelector('.btn-reg').disabled = true;
            document.querySelector('.btn-reg').style.background = "#ccc";
        }
    </script>
</body>
</html>
